server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 3600000

app:
  admin:
    email: ${APP_ADMIN_EMAIL:admin@reserix.athenialabs.com}
    password: ${APP_ADMIN_PASSWORD:ChangeIt}

  storage:
    upload-dir: ${APP_STORAGE_UPLOAD_DIRS:uploads}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reserix_db
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG