server:
  port: 8080

jwt:
  secret: "secret999999999999999999999999999999999999999999999999999999"
  access-token-expiration-ms: 3600000

app:
  admin:
    email: ${APP_ADMIN_EMAIL:admin@reserix.athenialabs.com}
    password: ${APP_ADMIN_PASSWORD:ChangeIt}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reserix_db
    username: reserix_user
    password: reserix_password
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
